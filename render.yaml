services:
  - type: web
    name: elecciones-fbc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ELECCIONES_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elecciones-fbc-db
          property: connectionString

databases:
  - name: elecciones-fbc-db
    plan: free
    postgresMajorVersion: "18"
